[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-fde-demo"
version = "0.1.0"
description = "网元告警采集与自动校验：模拟采集 → 规则校验 → HTML 报告"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LNaomi" }]
keywords = ["alarm", "telecom", "oam", "validation", "network-element"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]
# 运行期零第三方依赖：整个链路只用标准库
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
alarm-monitor = "alarm_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
