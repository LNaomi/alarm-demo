name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        run: pytest

      # --anomaly-rate 0 表示喂干净数据 + --strict 做质量门禁：
      # 一旦校验逻辑把正常告警误判为错误，CI 立刻失败。
      - name: 生成报告并作为构建产物上传
        run: python -m alarm_monitor --count 200 --anomaly-rate 0 --output reports/report.html --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alarm-report-py${{ matrix.python-version }}
          path: reports/report.html
