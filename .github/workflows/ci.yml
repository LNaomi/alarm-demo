name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 可编辑安装：src 布局的包必须装过才能 `python -m alarm_monitor` / `alarm-monitor`
      - name: 安装（运行期零第三方依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: 运行测试
        run: pytest

      # 质量门禁（误报门禁）：喂**完全干净**的数据（不注入脏数据、不模拟重传），
      # 校验结果必须零 error。一旦规则把正常告警误判为错误，CI 立刻失败。
      - name: 生成报告（误报门禁）
        run: |
          alarm-monitor --count 200 --anomaly-rate 0 --duplicate-rate 0 \
            --output reports/report.html --strict

      - name: 上传报告产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alarm-report-py${{ matrix.python-version }}
          path: reports/report.html
